<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 보드 - 클래식 UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto-Sans-KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #1c1c1b;
            --bg-secondary: #262625;
            --border-primary: #D4B783;
            --accent-primary: #D4B783;
            --text-primary: #EAEAEA;
            --text-secondary: #B0B0C0;
            --log-move: #60A5FA;
            --log-damage: #F87171;
            --log-heal: #4ADE80; 
            --log-system: #FBBF24;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            padding-top: 260px;
        }
        
        h1, h2, h3, button, .font-title { font-family: 'Cinzel', serif; letter-spacing: 1px; }

        /* --- Panels --- */
        .panel { 
            background-color: var(--bg-secondary); 
            border: 1px solid #444; 
            border-top: 2px solid var(--border-primary);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        /* --- Board --- */
        #game-board {
            display: grid;
            grid-template-columns: repeat(10, minmax(0, 1fr));
            grid-template-rows: repeat(10, minmax(0, 1fr));
            width: 100%; aspect-ratio: 1 / 1;
            max-width: 85vh;
            background-color: rgba(0,0,0,0.3);
            border: 1px solid #555;
        }
        .cell { border: 0.5px solid rgba(212, 183, 131, 0.2); position: relative; }
        .cell:hover { background-color: rgba(212, 183, 131, 0.1); }
        .cell.tile-obstacle { background-color: #333; opacity: 0.8; cursor: not-allowed; }
        .cell.tile-damage { background-color: rgba(153, 27, 27, 0.4); box-shadow: inset 0 0 10px red; }

        /* --- Tokens --- */
        .character-token { 
            width: 90%; height: 90%; 
            margin: 5%;
            background-size: cover; background-position: center; 
            border-radius: 50%; border: 2px solid transparent;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            position: absolute; z-index: 20;
        }
        .character-token.selected { border-color: var(--accent-primary); box-shadow: 0 0 15px var(--accent-primary); }
        .enemy-token { border-color: #ef4444; }

        /* --- UI Elements --- */
        .skill-btn { 
            background: linear-gradient(to bottom, #333, #111);
            border: 1px solid var(--border-primary);
            color: var(--accent-primary);
            padding: 8px 12px; font-size: 0.85rem;
            transition: all 0.2s;
        }
        .skill-btn:hover { background: var(--accent-primary); color: black; }
        
        #character-selection-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 240px;
            background: rgba(20, 20, 20, 0.95);
            border-bottom: 2px solid var(--border-primary);
            z-index: 100; transition: transform 0.3s;
        }
        #character-selection-overlay.collapsed { transform: translateY(-230px); }

        .hp-bar-small { position: absolute; bottom: -5px; left: 10%; width: 80%; height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
        .hp-fill-small { height: 100%; background: #ef4444; transition: width 0.3s; }

        #game-log-list li { border-left: 2px solid var(--border-primary); padding-left: 8px; margin-bottom: 4px; }
        .log-damage { color: var(--log-damage); }
        .log-heal { color: var(--log-heal); }
        .log-system { color: var(--log-system); font-weight: bold; }
    </style>
</head>
<body>

    <div id="character-selection-overlay" class="flex flex-col">
        <div id="selection-list" class="flex p-6 gap-4 overflow-x-auto h-full items-center">
            </div>
        <button id="overlay-toggle" class="self-center bg-zinc-800 border-x border-b border-gold px-4 py-1 text-xs text-gold rounded-b" style="border-color: var(--border-primary); color: var(--accent-primary);">
            PANEL TOGGLE
        </button>
    </div>

    <div class="max-w-[1600px] mx-auto px-4 flex flex-col lg:flex-row gap-6">
        
        <div class="panel lg:w-1/4 p-5 flex flex-col gap-4">
            <h2 class="text-xl font-bold text-center border-b border-zinc-700 pb-2">STATUS</h2>
            <div class="grid grid-cols-2 gap-2 text-center">
                <div class="bg-black/30 p-2 border border-zinc-800">
                    <p class="text-[10px] text-zinc-500 uppercase">Allies</p>
                    <span id="pc-count" class="text-3xl font-bold text-emerald-500">0</span>
                </div>
                <div class="bg-black/30 p-2 border border-zinc-800">
                    <p class="text-[10px] text-zinc-500 uppercase">Enemies</p>
                    <span id="enemy-count" class="text-3xl font-bold text-rose-500">0</span>
                </div>
            </div>

            <div id="turn-display" class="py-3 px-4 bg-zinc-900 border border-zinc-800 text-center">
                <p class="text-xs text-zinc-500 mb-1 uppercase">Current Turn</p>
                <div id="current-turn-char" class="text-lg font-bold text-gold" style="color: var(--accent-primary);">준비 중...</div>
            </div>

            <div id="skill-controls" class="flex flex-col gap-2 min-h-[100px]">
                </div>

            <div id="character-list" class="flex-grow overflow-y-auto max-h-[300px] border-t border-zinc-800 pt-4 space-y-2">
                </div>
            
            <button id="leave-game-btn" class="mt-4 border border-rose-900 text-rose-500 py-2 hover:bg-rose-900 hover:text-white transition text-xs">LEAVE GAME</button>
        </div>

        <div class="lg:w-2/4 flex flex-col items-center gap-4">
            <div id="game-board" class="panel"></div>
            <div class="flex gap-4">
                <button id="user-info-btn" class="skill-btn">MY INFO</button>
                <button id="admin-panel-btn" class="skill-btn" style="border-color: #9333ea; color: #c084fc;">ADMIN</button>
            </div>
        </div>

        <div class="panel lg:w-1/4 p-5">
            <h2 class="text-lg font-bold mb-4 border-b border-zinc-700 pb-2">GAME LOG</h2>
            <ul id="game-log-list" class="h-[65vh] overflow-y-auto text-[11px] leading-relaxed pr-2">
                </ul>
        </div>
    </div>

    <div id="game-lobby-modal" class="modal-backdrop fixed inset-0 flex items-center justify-center p-4 z-[200]">
        <div class="modal-content p-10 max-w-md w-full bg-zinc-900 border-2 border-gold" style="border-color: var(--border-primary);">
            <h2 class="text-3xl font-bold text-center mb-8">ENTRY</h2>
            <div class="space-y-6">
                <button id="create-game-btn" class="w-full py-4 bg-emerald-800 font-bold hover:bg-emerald-700 transition">CREATE NEW SESSION</button>
                <div class="relative flex items-center"><div class="flex-grow border-t border-zinc-700"></div><span class="px-4 text-zinc-500 text-sm">OR</span><div class="flex-grow border-t border-zinc-700"></div></div>
                <div class="flex gap-2">
                    <input type="text" id="game-id-input" placeholder="CODE" class="bg-black border border-zinc-700 p-3 flex-grow text-center font-bold">
                    <button id="join-game-btn" class="bg-blue-800 px-6 font-bold hover:bg-blue-700 transition">JOIN</button>
                </div>
            </div>
        </div>
    </div>

    <div id="admin-password-modal" class="modal-backdrop fixed inset-0 flex items-center justify-center p-4 z-[210] hidden">
        <div class="modal-content p-8 bg-zinc-900 border border-gold" style="border-color: var(--border-primary);">
            <h3 class="font-bold mb-4">ADMIN ACCESS</h3>
            <input type="password" id="admin-password-input" class="bg-black border border-zinc-700 p-2 w-full mb-4">
            <div class="flex gap-2">
                <button onclick="document.getElementById('admin-password-modal').classList.add('hidden')" class="flex-grow py-2 bg-zinc-800">CANCEL</button>
                <button id="submit-admin-login-btn" class="flex-grow py-2 bg-purple-800">CONFIRM</button>
            </div>
        </div>
    </div>

    <script type="module">
        // Firebase 및 초기화 로직 (오류가 수정된 버전 유지)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, query, getDocs, writeBatch, getDoc, setDoc, addDoc, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBAXRaW8GvOxpmvPs3um3o7lf9LUbWMVSE",
            authDomain: "cheongsongmas.firebaseapp.com",
            projectId: "cheongsongmas",
            storageBucket: "cheongsongmas.firebasestorage.app",
            messagingSenderId: "483983625842",
            appId: "1:483983625842:web:033711eb780b50e0ad3ceb",
            measurementId: "G-5P3FRDJFH2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let characters = [], SKILLS = {}, gameId = null;
        let isAdmin = false, loggedInCharId = null, gameState = 'PREPARATION';
        let selectedCharacterId = null, selectedSkill = 'move';
        let boardTiles = {}, isBoardInitialized = false;

        // --- Logic: Game Data Listener ---
        function listenForGameData(id) {
            onSnapshot(doc(db, 'games', id), (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();
                gameState = data.gameState || 'PREPARATION';
                SKILLS = data.skills || {};
                render();
            });

            onSnapshot(collection(db, "games", id, "characters"), (snap) => {
                characters = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            });

            onSnapshot(doc(db, 'games', id, 'board', 'tiles'), (snap) => {
                boardTiles = snap.data()?.tiles || {};
                render();
            });

            onSnapshot(query(collection(db, "games", id, "logs"), orderBy("timestamp", "desc")), (snap) => {
                const logList = document.getElementById('game-log-list');
                logList.innerHTML = snap.docs.map(d => {
                    const type = d.data().type;
                    return `<li class="log-${type}">${d.data().message}</li>`;
                }).join('');
            });
        }

        // --- Logic: Render ---
        function render() {
            if (!isBoardInitialized) {
                gameBoard.innerHTML = '';
                for (let y = 0; y < 10; y++) {
                    for (let x = 0; x < 10; x++) {
                        const c = document.createElement('div');
                        c.className = 'cell'; c.dataset.x = x; c.dataset.y = y;
                        gameBoard.appendChild(c);
                    }
                }
                isBoardInitialized = true;
            }

            document.querySelectorAll('.cell').forEach(cell => {
                cell.innerHTML = '';
                const tile = boardTiles[`${cell.dataset.x},${cell.dataset.y}`];
                cell.className = 'cell' + (tile ? ` tile-${tile.type}` : '');
            });

            characters.filter(c => c.x !== null).forEach(char => {
                const cell = gameBoard.querySelector(`[data-x="${char.x}"][data-y="${char.y}"]`);
                if (cell) {
                    const token = document.createElement('div');
                    token.className = `character-token ${char.id === selectedCharacterId ? 'selected' : ''} ${char.type === 'ENEMY' ? 'enemy-token' : ''}`;
                    token.style.backgroundImage = char.imageUrl ? `url(${char.imageUrl})` : 'none';
                    if (!char.imageUrl) token.innerHTML = `<span class="flex items-center justify-center h-full text-zinc-500 font-bold">${char.name[0]}</span>`;
                    
                    const hpBar = document.createElement('div');
                    hpBar.className = 'hp-bar-small';
                    hpBar.innerHTML = `<div class="hp-fill-small" style="width: ${(char.hp/char.maxHp)*100}%"></div>`;
                    token.appendChild(hpBar);
                    
                    cell.appendChild(token);
                }
            });

            document.getElementById('pc-count').textContent = characters.filter(c => c.type === 'PC' && c.hp > 0).length;
            document.getElementById('enemy-count').textContent = characters.filter(c => c.type === 'ENEMY' && c.hp > 0).length;
            
            renderSkillButtons();
        }

        function renderSkillButtons() {
            const sc = document.getElementById('skill-controls');
            sc.innerHTML = '';
            if (gameState === 'PREPARATION') {
                if (isAdmin) {
                    sc.innerHTML = `<button id="admin-start-game-btn" class="w-full bg-emerald-800 border border-emerald-500 py-2 font-bold text-white hover:bg-emerald-700 transition">⚔️ START SESSION</button>`;
                } else {
                    sc.innerHTML = `<p class="text-center text-xs text-zinc-500 italic">WAITING FOR ADMIN...</p>`;
                }
            } else {
                const curChar = characters.find(c => c.id === selectedCharacterId);
                if (curChar) {
                    curChar.skills.forEach(sid => {
                        const s = SKILLS[sid];
                        if (s) {
                            const b = document.createElement('button');
                            b.className = `skill-btn ${selectedSkill === sid ? 'bg-gold text-black' : ''}`;
                            b.textContent = s.name.toUpperCase();
                            b.onclick = () => { selectedSkill = sid; render(); };
                            sc.appendChild(b);
                        }
                    });
                }
            }
        }

        // --- Logic: Events ---
        document.getElementById('skill-controls').addEventListener('click', async (e) => {
            if (e.target && e.target.id === 'admin-start-game-btn') {
                if (!gameId) return;
                await updateDoc(doc(db, 'games', gameId), { gameState: 'STARTED', roundPhase: 'PLAYER_PHASE' });
                await addDoc(collection(db, "games", gameId, "logs"), { message: "⚔️ 전투가 시작되었습니다!", type: "system", timestamp: serverTimestamp() });
            }
        });

        document.getElementById('overlay-toggle').onclick = () => {
            document.getElementById('character-selection-overlay').classList.toggle('collapsed');
        };

        document.getElementById('create-game-btn').onclick = async () => {
            const id = Math.random().toString(36).substring(2, 8).toUpperCase();
            gameId = id;
            await setDoc(doc(db, 'games', id), { gameState: 'PREPARATION', adminPassword: '0000', round: 1, skills: { slash: { name: '베기', range: 1, multiplier: 1 } } });
            localStorage.setItem('currentGameId', id);
            location.reload();
        };

        document.getElementById('join-game-btn').onclick = () => {
            const id = document.getElementById('game-id-input').value.toUpperCase();
            if (id) { gameId = id; localStorage.setItem('currentGameId', id); location.reload(); }
        };

        document.getElementById('submit-admin-login-btn').onclick = async () => {
            const pw = document.getElementById('admin-password-input').value;
            const snap = await getDoc(doc(db, 'games', gameId));
            if (snap.data().adminPassword === pw) {
                isAdmin = true; document.getElementById('admin-password-modal').classList.add('hidden'); render();
            }
        };

        gameBoard.onclick = async (e) => {
            const cell = e.target.closest('.cell');
            if (!cell) return;
            const x = parseInt(cell.dataset.x), y = parseInt(cell.dataset.y);
            const charHere = characters.find(c => c.x === x && c.y === y);
            if (charHere) { selectedCharacterId = charHere.id; render(); }
            else if (isAdmin && selectedCharacterId) {
                await updateDoc(doc(db, 'games', gameId, 'characters', selectedCharacterId), { x, y });
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const saved = localStorage.getItem('currentGameId');
                if (saved) { gameId = saved; document.getElementById('game-lobby-modal').classList.add('hidden'); listenForGameData(saved); }
            } else signInAnonymously(auth);
        });

        document.getElementById('leave-game-btn').onclick = () => { localStorage.removeItem('currentGameId'); location.reload(); };

    </script>
</body>
</html>
